<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 오답 mate - 나만의 맞춤형 AI 오답노트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- 헤더 영역 -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-tight">✨ AI 오답 mate</h1>
            <p class="text-emerald-100 text-sm mt-1">나만의 맞춤형 AI 오답노트 및 분석 솔루션</p>
        </div>

        <!-- 입력 폼 영역 -->
        <form id="aiForm" class="p-6 sm:p-8 space-y-6">
            
            <!-- 과목 선택 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">과목</label>
                <select id="analysisSubject" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50 text-slate-700 transition">
                    <option value="" disabled selected>과목을 선택해주세요</option>
                    <option value="국어">국어</option>
                    <option value="수학">수학</option>
                    <option value="영어">영어</option>
                    <option value="사회/탐구">사회/탐구</option>
                    <option value="과학/탐구">과학/탐구</option>
                    <option value="기타">기타</option>
                </select>
            </div>

            <!-- 정답 및 내 답 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">정답</label>
                    <input type="text" id="correctAnswer" required placeholder="예: 3번 또는 sin(x)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">내 답</label>
                    <input type="text" id="myAnswer" required placeholder="예: 2번 또는 cos(x)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50 transition">
                </div>
            </div>

            <!-- 내 풀이 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">내 풀이 과정</label>
                <textarea id="mySolution" rows="4" required placeholder="내가 문제를 풀 때 접근했던 방식이나 과정을 자유롭게 작성해주세요." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50 transition resize-none"></textarea>
            </div>

            <!-- 풀이 이미지 업로드 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">풀이 이미지 업로드 <span class="text-xs text-slate-400 font-normal">(선택 사항)</span></label>
                <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-emerald-500 transition cursor-pointer bg-slate-50 relative">
                    <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div id="uploadPrompt">
                        <p class="text-sm text-slate-600">여기에 파일을 드래그하거나 <span class="text-emerald-600 font-semibold underline">클릭하여 업로드</span></p>
                    </div>
                    <div id="previewContainer" class="hidden mt-2">
                        <img id="imagePreview" class="max-h-40 mx-auto rounded-lg shadow-sm" alt="미리보기">
                        <p id="fileName" class="text-xs text-slate-500 mt-2"></p>
                    </div>
                </div>
            </div>

            <!-- 질문/궁금한 점 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">질문/궁금한 점 <span class="text-xs text-slate-400 font-normal">(선택 사항)</span></label>
                <textarea id="userQuestion" rows="2" placeholder="AI에게 특별히 물어보고 싶은 점이 있다면 작성해주세요. (예: 다른 풀이 방법은 없나요?)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50 transition resize-none"></textarea>
            </div>

            <!-- 제출 버튼 -->
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 flex items-center justify-center space-x-2">
                <span id="btnText">AI 오답 분석 시작 🚀</span>
            </button>
        </form>
    </div>

    <!-- 로직 스크립트 -->
    <script>
        let imageBase64Data = null;
        let uploadedFileMimeType = "image/jpeg";

        // 이미지 파일 업로드 핸들링 (Base64 변환)
        const imageInput = document.getElementById('imageInput');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const fileNameText = document.getElementById('fileName');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadedFileMimeType = file.type || "image/jpeg";
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    imageBase64Data = uploadEvent.target.result;
                    imagePreview.src = imageBase64Data;
                    uploadPrompt.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                    fileNameText.textContent = file.name;
                };
                reader.readAsDataURL(file);
            }
        });

        // 폼 제출 이벤트
        document.getElementById('aiForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // API Key 관리 (콘솔창에서 localStorage.clear() 하셨으므로 키를 다시 물어봅니다)
            let apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                apiKey = prompt("AQ. 로 시작하는 API 키를 다시 입력해주세요:");
                if (!apiKey) return;
                localStorage.setItem('gemini_api_key', apiKey.trim());
            }
            apiKey = apiKey.trim();

            // 입력값 수집
            const analysisSubject = document.getElementById('analysisSubject').value;
            const correctAnswer = document.getElementById('correctAnswer').value;
            const myAnswer = document.getElementById('myAnswer').value;
            const mySolution = document.getElementById('mySolution').value;
            const userQuestion = document.getElementById('userQuestion').value;

            // 로딩 상태 UI 변경
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = "AI 분석 중... 🚀";

            // 프롬프트 구성
            let promptText = `
당신은 학생들의 오답을 친절하고 명확하게 분석해주는 최고의 AI 오답노트 메이트입니다. 
아래 학생의 오답 정보를 바탕으로 마크다운 형식으로 상세한 분석 리포트를 작성해주세요.

[오답 정보]
- 과목: ${analysisSubject}
- 정답: ${correctAnswer}
- 학생이 적은 답: ${myAnswer}
- 학생의 풀이 과정: ${mySolution}
- 추가 질문: ${userQuestion || '없음'}

[작성 가이드라인]
1. 오답 원인 분석: 학생이 왜 이런 실수를 했거나 어떤 개념을 오해했는지 분석해주세요.
2. 올바른 접근법 및 해설: 정답을 도출하기 위한 핵심 개념과 정확한 풀이 과정을 단계별로 설명해주세요.
3. 맞춤형 조언 및 팁: 앞으로 유사한 문제를 틀리지 않기 위한 공부 팁이나 기억해야 할 공식을 정리해주세요.
4. 마크다운 태그를 활용해 가독성 좋게 작성해주세요.
`;

            // Gemini API 요청 데이터 구조 설정
            const contentsParts = [{ text: promptText }];

            // 이미지가 있다면 멀티모달 데이터 추가
            if (imageBase64Data) {
                const base64String = imageBase64Data.split(',')[1];
                contentsParts.push({
                    inline_data: {
                        mime_type: uploadedFileMimeType,
                        data: base64String
                    }
                });
            }

            const requestData = {
                contents: [{ parts: contentsParts }]
            };

            try {
                // 모델명을 안정적인 gemini-1.5-flash로 변경
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    const errorJson = await response.json();
                    throw new Error(errorJson.error?.message || `API 호출 실패: ${response.statusText}`);
                }

                const result = await response.json();
                const aiResponseText = result.candidates[0].content.parts[0].text;

                // LocalStorage에 결과 및 데이터 저장 후 result.html로 이동
                localStorage.setItem('aiAnalysisResult', aiResponseText);
                localStorage.setItem('myAnswer', myAnswer);
                localStorage.setItem('correctAnswer', correctAnswer);
                localStorage.setItem('analysisSubject', analysisSubject);

                window.location.href = 'result.html';

            } catch (error) {
                console.error(error);
                alert("오답 분석 중 오류가 발생했습니다. API Key나 네트워크 상태를 확인해주세요.\n\n상세 내용: " + error.message);
                
                // 에러 발생 시 저장된 키 초기화
                localStorage.removeItem('gemini_api_key');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = "AI 오답 분석 시작 🚀";
            }
        });
    </script>
</body>
</html>
